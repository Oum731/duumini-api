    <style>
      /* ✅ Écran de chargement affiché instantanément (inline, sans dépendance
         JS/CSS externe) le temps que le bundle React se charge et s'exécute
         — évite l'écran blanc au lancement de l'app/PWA. Le contenu est à
         l'intérieur de #root : React le remplace automatiquement dès son
         premier rendu, sans script de nettoyage nécessaire. */
      #root {
        min-height: 100vh;
      }
      .duu-boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        z-index: 9999;
      }
      .duu-boot-loader img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        animation: duu-boot-pulse 1.6s ease-in-out infinite;
      }
      .duu-boot-ring {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(181, 83, 60, 0.18);
        border-top-color: #b5533c;
        animation: duu-boot-spin 0.8s linear infinite;
      }
      .duu-boot-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        font-size: 0.85rem;
        font-weight: 600;
        color: #6b6b6b;
        letter-spacing: 0.02em;
      }
      @keyframes duu-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes duu-boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.94);
          opacity: 0.85;
        }
      }
      @media (prefers-color-scheme: dark) {
        .duu-boot-loader {
          background: #111111;
        }
        .duu-boot-label {
          color: #a3a3a3;
        }
      }
    </style>
